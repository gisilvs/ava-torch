synth:
  sample_rate: 24000
  noise_seed: 0
  lfo_control_rate: 200

note:
  midi_pitch: 60
  duration: 6.0
  note_press_duration: 4.0
  velocity: 1.0

# Physical parameters, not normalized network outputs.
preset:
  gain: 0.2
  oscillator: 0  # 0: sine, 1: square, 2: sawtooth, 3: triangle
  oscillator_b: null
  mix: 0.5
  detune_cents: 0.0
  noise_mix: 0.0
  cutoff_octaves: null  # null bypasses the filter
  q: 0.707
  lfo_rate: null  # null uses a static cutoff
  lfo_depth: 0.0
  drive: 0.0
  attack: 0.01
  decay: 0.2
  sustain: 1.0
  release: 1.5

output: outputs/render.wav

hydra:
  job:
    chdir: false
